[package]
name = "ptyra"
version = "0.0.1"
edition = "2024"

[features]
renderer-probe = []
gles-probe = ["renderer-probe"]

[[example]]
name = "renderer_probe"
required-features = ["renderer-probe"]

[dependencies]
ab_glyph = { version = "=0.2.32", default-features = false, features = ["std"] }
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
alacritty_terminal = { version = "=0.26.0", default-features = false }
kbvm = { version = "=0.2.0", default-features = false }
png = { version = "=0.18.1", default-features = false }
# Dependency log statements may contain terminal or input payloads.
log = { version = "=0.4.34", default-features = false, features = ["max_level_off", "release_max_level_off"] }
toml = { version = "=1.1.6", default-features = false, features = ["std", "parse", "serde"] }
unicode-width = { version = "=0.2.3", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["feature", "fs", "poll", "process", "signal", "term", "user"] }
wayland-client = { version = "=0.31.15", default-features = false }
wayland-protocols = { version = "=0.32.13", default-features = false, features = ["client", "unstable"] }
